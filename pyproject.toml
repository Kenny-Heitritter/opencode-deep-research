[project]
name = "opencode-deep-research-mcp"
version = "0.1.0"
description = "OpenCode Deep Research MCP Server - async job runner calling OpenCode server endpoints"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.scripts]
opencode-deep-research-mcp = "opencode_deep_research_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"